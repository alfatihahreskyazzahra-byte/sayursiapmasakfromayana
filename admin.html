<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Struk 58mm</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box} body{font-family:Poppins,sans-serif;background:#eef3ee;padding:16px;margin:0}
.header{max-width:1100px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;background:white;padding:12px 16px;border-radius:12px;border:1px solid #e2e8f0;flex-wrap:wrap;gap:10px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;justify-items:center}
.struk-wrap{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.struk{width:100%;max-width:340px;background:white;border-radius:14px;padding:16px 14px;box-shadow:0 4px 14px rgba(0,0,0,.08);border:1px solid #e9e9e9}
.struk-head{text-align:center}.struk-head b{display:block;font-size:14px;font-weight:800}.struk-head small{color:#475569;font-size:11px}.struk-head.tgl{font-size:11px;margin-top:2px;color:#334155}
.dashed{border-top:2px dashed #2f8a4c;margin:12px 0}
.field{background:#f8fafc;border:1px solid #eef2f7;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.item-block{margin:10px 0}.item-line{display:flex;justify-content:space-between;gap:10px}.item-name{font-weight:700;font-size:12px;text-transform:uppercase;flex:1}.item-price{font-weight:600;font-size:12px;min-width:100px;text-align:right;white-space:nowrap}.item-komposisi{font-size:10px;color:#64748b;margin-top:2px;padding-right:100px}
.total-line{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px;margin-top:4px}.total-line span:last-child{min-width:100px;text-align:right}
.action-below{display:flex;gap:8px;flex-wrap:wrap}.action-below button{flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:11px;cursor:pointer;min-width:90px}.btn-print-out{background:white;border:1px solid #ddd}.btn-dl-out{background:#0f6d3a;color:white;border:1px solid #0f6d3a}.btn-del-out{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:600px){.wrap{grid-template-columns:1fr}}
@media print{ @page{size:80mm auto;margin:3mm}.no-print{display:none!important} body{background:white;padding:0}.wrap{display:block}.struk-wrap{max-width:80mm;width:80mm;margin:0 auto}.struk{max-width:80mm;width:80mm;box-shadow:none!important;border:none!important;border-radius:0!important;padding:0} }
</style>
</head>
<body>
<div class="header no-print"><h3 style="margin:0;font-size:14px">📋 Admin Struk</h3><div class="header-actions"><button onclick="downloadCSV()" style="padding:8px 12px;border-radius:8px;border:0;background:#e2e8f0;font-weight:700">CSV</button> <button onclick="hapusSemuaStruk()" style="padding:8px 12px;border-radius:8px;border:0;background:#ef4444;color:white;font-weight:700">🗑️ Hapus Semua</button> <button onclick="window.print()" style="padding:8px 12px;border-radius:8px;border:0;background:#0f6d3a;color:white;font-weight:700">Cetak Semua</button></div></div>
<div class="wrap" id="list"></div>
<script>
var riwayat = JSON.parse(localStorage.getItem("sayur_riwayat")||"[]");
var el = document.getElementById("list");
if(riwayat.length==0){ el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;background:white;border-radius:12px">Belum ada data.</div>'; }else{
  var riwayatRev = riwayat.slice().reverse();
  var html="";
  for(var i=0;i<riwayatRev.length;i++){
    var r=riwayatRev[i]; var itemsHtml="";
    for(var j=0;j<r.items.length;j++){
      var it=r.items[j]; var sub=(it.harga||it.price||0)*(it.qty||1); if(sub==0&&r.total>0) sub=Math.round(r.total/r.items.length);
      var komp=it.komposisi||it.bahan||("x"+(it.qty||1)); if(it.komposisi) komp=it.komposisi+" x"+(it.qty||1);
      itemsHtml+='<div class="item-block"><div class="item-line"><span class="item-name">'+(it.nama||"").toUpperCase()+'</span><span class="item-price">Rp '+sub.toLocaleString("id-ID")+'</span></div><div class="item-komposisi">'+komp+'</div></div>';
    }
    var hp=r.hp||r.nohp||"No HP tidak ada";
    html+='<div class="struk-wrap" id="wrap-'+i+'"><div class="struk" id="struk-'+i+'"><div class="struk-head"><div style="font-size:18px">🥗</div><b>SayurSiapMasakAi</b><small>'+hp+' - Makassar</small><div class="tgl">'+r.tanggal+'</div></div><div class="dashed"></div><div class="field">'+r.nama+'</div><div class="field">'+r.alamat+'</div>'+itemsHtml+'<div class="dashed"></div><div class="total-line"><span>TOTAL</span><span>Rp '+(r.total||0).toLocaleString("id-ID")+'</span></div><div style="text-align:center;margin-top:10px;font-size:10px;color:#94a3b8">Terima kasih sudah belanja!<br>Pesanan diproses & diantar sesuai alamat</div></div><div class="action-below no-print"><button class="btn-print-out" onclick="cetakSatu('+i+')">🖨️ Print</button><button class="btn-dl-out" onclick="downloadJPG('+i+')">⬇️ Download</button><button class="btn-del-out" onclick="hapusStruk('+i+')">🗑️ Hapus</button></div></div>';
  }
  el.innerHTML=html;
}
function cetakSatu(idx){ var all=document.querySelectorAll(".struk-wrap"); for(var k=0;k<all.length;k++){ if(k!=idx) all[k].style.display="none"; } window.print(); setTimeout(function(){ for(var k=0;k<all.length;k++) all[k].style.display=""; },500); }
function downloadJPG(idx){ var t=document.getElementById("struk-"+idx); html2canvas(t,{scale:3,backgroundColor:"#ffffff"}).then(function(cv){ var a=document.createElement("a"); a.download="struk-"+Date.now()+".jpg"; a.href=cv.toDataURL("image/jpeg",0.95); a.click(); }); }
function downloadCSV(){ var data=JSON.parse(localStorage.getItem("sayur_riwayat")||"[]"); if(data.length==0) return alert("Belum ada data"); var csv="Tanggal,Nama,HP,Alamat,Items,Total\n"; for(var i=0;i<data.length;i++){ var r=data[i]; var it=""; for(var j=0;j<r.items.length;j++) it+=r.items[j].nama+" x"+r.items[j].qty+"; "; csv+='"'+r.tanggal+'","'+r.nama+'","'+(r.hp||"")+'","'+r.alamat+'","'+it+'","'+r.total+'"\n'; } var blob=new Blob([csv],{type:"text/csv"}); var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download="rekap.csv"; a.click(); }
function hapusStruk(idxRev){
  if(!confirm('Hapus struk ini?')) return;
  var data=JSON.parse(localStorage.getItem("sayur_riwayat")||"[]");
  var origIndex = data.length - 1 - idxRev;
  data.splice(origIndex,1);
  localStorage.setItem("sayur_riwayat", JSON.stringify(data));
  location.reload();
}
function hapusSemuaStruk(){
  if(!confirm('Hapus SEMUA struk? semua struk akan hilang!')) return;
  if(!confirm('Yakin 100% hapus semua?')) return;
  localStorage.removeItem("sayur_riwayat");
  location.reload();
}
</script>
</body>
</html>
